<div class="layout-container">
  <div class="controls glass">
    <span style="margin-right: 1rem; font-weight: 500; color: var(--text-secondary);">Layout Mode:</span>
    <button
      class="mode-btn"
      [class.active]="layoutMode === 'grid'"
      (click)="setLayout('grid')">
      Grid System
    </button>
    <button
      class="mode-btn"
      [class.active]="layoutMode === 'flex'"
      (click)="setLayout('flex')">
      Flex Layout
    </button>
  </div>

  <div class="display-area" [ngClass]="layoutMode === 'grid' ? 'grid-mode' : 'flex-mode'">
    @for (card of cards; track card) {
      <div class="glass-card card">
        <div class="card-header">
          <span class="card-title">{{ card.title }}</span>
          <span class="badge" [ngClass]="card.type === 'blue' ? 'badge-blue' : 'badge-purple'">Active</span>
        </div>
        <div class="card-body">
          {{ card.content }}
        </div>
        <div class="card-footer">
          <button class="btn-premium" style="padding: 0.4rem 1rem; font-size: 0.8rem;">Configure</button>
        </div>
      </div>
    }
  </div>

  <!-- Floating Widget -->
  <div class="floating-widget">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>
  </div>
</div>
