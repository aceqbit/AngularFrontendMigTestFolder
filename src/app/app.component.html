<div class="dashboard-shell">
  <!-- Sidebar -->
  <aside class="sidebar glass">
    <div class="logo-container">
      <div class="logo-box">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 17L12 22L22 17" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 12L12 17L22 12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="logo-text">NEURAL<span class="text-gradient">FLOW</span></span>
    </div>

    <nav class="nav-links">
      <div class="nav-item" [class.active]="activeView === 'dashboard'" (click)="setView('dashboard')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        Layout Manager
      </div>
      <div class="nav-item" [class.active]="activeView === 'grid'" (click)="setView('grid')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3zM3 9h18M3 15h18M9 3v18M15 3v18"></path></svg>
        Premium Grid
      </div>
      <div class="nav-item" [class.active]="activeView === 'calendar'" (click)="setView('calendar')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        Event Calendar
      </div>
      <div class="nav-item" [class.active]="activeView === 'workflow'" (click)="setView('workflow')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
        Workflow Designer
      </div>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <header class="top-nav glass">
      <div class="page-title">
        <span *ngIf="activeView === 'dashboard'">Layout Engine / Visualization</span>
        <span *ngIf="activeView === 'grid'">Data Intelligence / Neural Grid</span>
        <span *ngIf="activeView === 'calendar'">Temporal Planning / Scheduler</span>
        <span *ngIf="activeView === 'workflow'">Logic Architecture / Designer</span>
      </div>
      <div class="user-profile">
        <input type="text" class="search-bar" placeholder="Universal Search...">
        <div class="avatar" style="width: 38px; height: 38px; background: var(--accent-gradient);">AS</div>
      </div>
    </header>

    <div class="content-area">
      <app-layout-manager *ngIf="activeView === 'dashboard'"></app-layout-manager>
      <app-data-grid *ngIf="activeView === 'grid'"></app-data-grid>
      <app-calendar *ngIf="activeView === 'calendar'"></app-calendar>
      <app-workflow-designer *ngIf="activeView === 'workflow'"></app-workflow-designer>
    </div>
  </main>
</div>
